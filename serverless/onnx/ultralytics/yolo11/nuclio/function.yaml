metadata:
  name: onnx-ultralytics-yolo11-football
  namespace: cvat
  annotations:
    name: YOLO 11 Football
    type: detector
    spec: |
      [
        { "id": 0, "name": "ball", "type": "rectangle" },
        { "id": 1, "name": "team1", "type": "rectangle" },
        { "id": 2, "name": "team2", "type": "rectangle" },
        { "id": 3, "name": "goalkeeper", "type": "rectangle" },
        { "id": 4, "name": "referee", "type": "rectangle" }
      ]
    yolo_labels: '{"0": "ball", "1": "player"}'
    cluster_label_map: '{"0": "team1", "1": "team2", "2": "goalkeeper", "3": "referee"}'
    onnx_model: "20260320_yolo11m.onnx"
    kmeans_model: "20260320_kmeans.joblib"

spec:
  description: YOLO 11 Football Detection (ball, goalkeeper, player, referee) via ONNX
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  build:
    image: cvat.onnx.ultralytics.yolo11.football
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install --no-install-recommends -y python3-pip python-is-python3 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install onnxruntime opencv-python-headless pillow pyyaml numpy scikit-learn joblib --no-cache-dir
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
